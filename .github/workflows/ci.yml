name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - stage
  pull_request:
    branches:
      - main
      - master
      - develop
      - stage
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: matharchive
          POSTGRES_USER: matharchive
          POSTGRES_PASSWORD: matharchive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matharchive -d matharchive"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=matharchive;Username=matharchive;Password=matharchive
      Jwt__SigningKey: ci-signing-key-for-matharchive-at-least-32-characters
      Admin__Username: admin
      Admin__PasswordHash: PBKDF2-SHA256$100000$AAAAAAAAAAAAAAAAAAAAAA==$AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AllowedOrigins__0: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore backend
        run: dotnet restore backend/MathArchive.sln

      - name: Build backend
        run: dotnet build backend/MathArchive.sln --configuration Release --no-restore

      - name: Test backend
        run: dotnet test backend/MathArchive.sln --configuration Release --no-build --verbosity normal

      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef --version "9.*"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Validate EF migrations
        run: dotnet ef database update --project backend/src/MathArchive.Infrastructure --startup-project backend/src/MathArchive.Api --configuration Release

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/math-archive-web

    env:
      VITE_API_BASE_URL: https://example-render-api.onrender.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/math-archive-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build
